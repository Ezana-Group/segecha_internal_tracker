services:
  segecha-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: segecha_internal_tracker
    ports:
      - "3001:3001"
    env_file:
      - .env
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
