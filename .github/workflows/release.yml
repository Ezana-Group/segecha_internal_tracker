name: Release Desktop App

# ── Trigger ──────────────────────────────────────────────────────────────────
# Fires when you push a tag like v1.2.0, v1.2.3, etc.
# To release: git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - 'v*.*.*'

# ── Permissions ───────────────────────────────────────────────────────────────
# contents:write is required to create a GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build & Publish (${{ matrix.os }})
    strategy:
      fail-fast: false          # let both platforms finish even if one fails
      matrix:
        include:
          - os: macos-latest
            platform_flag: --mac
            artifact_label: macOS
          - os: windows-latest
            platform_flag: --win
            artifact_label: Windows

    runs-on: ${{ matrix.os }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── 2. Node setup ────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Sync package.json version with the git tag ─────────────────────────
      # Ensures DMG/EXE files are named correctly (e.g. 1.2.3 not 1.2.1)
      # even if package.json was not manually bumped before tagging.
      - name: Sync version from git tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "Setting package.json version to $TAG"
          npm version "$TAG" --no-git-tag-version --allow-same-version

      # ── 4. Write .env so the packaged app has DB credentials ─────────────────
      - name: Write .env file
        shell: bash
        run: |
          cat > .env << 'EOF'
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          ADMIN_KEY=${{ secrets.ADMIN_KEY }}
          PORT=3001
          EOF
          echo ".env written"

      # ── 5. Install dependencies ───────────────────────────────────────────────
      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install driver-portal dependencies
        run: npm ci
        working-directory: driver-portal

      - name: Install track-portal dependencies
        run: npm ci
        working-directory: track-portal

      - name: Install payment-portal dependencies
        run: npm ci
        working-directory: payment-portal

      # ── 6. Build all frontends ────────────────────────────────────────────────
      - name: Build all frontends
        run: npm run build:all

      # ── 7. Package Electron + publish to GitHub Releases ─────────────────────
      - name: Build & publish Electron app (${{ matrix.artifact_label }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ''
          WIN_CSC_KEY_PASSWORD: ''
        run: >
          npx electron-builder
          ${{ matrix.platform_flag }}
          --publish always

      # ── 8. Print release summary ──────────────────────────────────────────────
      - name: Print release summary
        shell: bash
        run: |
          echo "### ✅ ${{ matrix.artifact_label }} build complete" >> $GITHUB_STEP_SUMMARY
          echo "Tag: \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "Assets uploaded to the GitHub Release for this tag." >> $GITHUB_STEP_SUMMARY

  publish:
    name: Publish Release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Publish GitHub Release as non-draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Publishing release $TAG..."
          gh release edit "$TAG" --draft=false --latest || true
          echo "Done."

