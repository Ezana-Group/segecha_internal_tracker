name: Release Desktop App

# ── Trigger ──────────────────────────────────────────────────────────────────
# Fires when you push a tag like v1.2.0, v1.2.3, etc.
# To release: git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags:
      - 'v*.*.*'

# ── Permissions ───────────────────────────────────────────────────────────────
# contents:write is required to create a GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build & Publish (${{ matrix.os }})
    strategy:
      fail-fast: false          # let both platforms finish even if one fails
      matrix:
        include:
          - os: macos-latest
            platform_flag: --mac
            artifact_label: macOS
          - os: windows-latest
            platform_flag: --win
            artifact_label: Windows

    runs-on: ${{ matrix.os }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── 2. Node setup ────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Write .env so the packaged app has DB credentials ─────────────────
      # DATABASE_URL is stored as a GitHub Actions secret.
      # ADMIN_KEY is the passphrase for the admin account (also a secret).
      - name: Write .env file
        shell: bash
        run: |
          cat > .env << 'EOF'
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          ADMIN_KEY=${{ secrets.ADMIN_KEY }}
          PORT=3001
          EOF
          echo ".env written"

      # ── 4. Install root + sub-portal dependencies ─────────────────────────────
      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install driver-portal dependencies
        run: npm ci
        working-directory: driver-portal

      - name: Install track-portal dependencies
        run: npm ci
        working-directory: track-portal

      - name: Install payment-portal dependencies
        run: npm ci
        working-directory: payment-portal

      # ── 5. Build all frontends ────────────────────────────────────────────────
      - name: Build all frontends
        run: npm run build:all

      # ── 6. Package Electron + publish to GitHub Releases ─────────────────────
      # GH_TOKEN tells electron-builder which repo to attach the release assets to.
      # CSC_IDENTITY_AUTO_DISCOVERY=false skips macOS code-signing (no cert needed
      # for internal distribution — users just right-click → Open on first launch).
      - name: Build & publish Electron app (${{ matrix.artifact_label }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false        # skip macOS code-signing
          WIN_CSC_LINK: ''                           # skip Windows code-signing
          WIN_CSC_KEY_PASSWORD: ''
        run: >
          npx electron-builder
          ${{ matrix.platform_flag }}
          --publish always

      # ── 7. Summary ────────────────────────────────────────────────────────────
      - name: Print release summary
        shell: bash
        run: |
          echo "### ✅ ${{ matrix.artifact_label }} build complete" >> $GITHUB_STEP_SUMMARY
          echo "Tag: \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "Assets uploaded to the GitHub Release for this tag." >> $GITHUB_STEP_SUMMARY
